<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5BA69A" stop-opacity="0.35"/><stop offset="70%" stop-color="#0E2A47" stop-opacity="0.05"/><stop offset="100%" stop-color="#0E2A47" stop-opacity="0"/></radialGradient>
