.r2{transform-origin:300px 300px;animation:spinr 90s linear infinite}
.r3{transform-origin:300px 300px;animation:spin 140s linear infinite}
.p{animation:pulse 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.r1,.r2,.r3,.p{animation:none}}
</style></defs>
