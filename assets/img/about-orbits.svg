<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Orbital illustration">
<defs>
<radialGradient id="g" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="#5BA69A" stop-opacity=".30"/><stop offset="60%" stop-color="#15385C" stop-opacity=".25"/><stop offset="100%" stop-color="#0E2A47" stop-opacity="0"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2D4B"/><stop offset="1" stop-color="#143B57"/></linearGradient>
<style>
.orb{fill:none;stroke:#5BA69A;stroke-opacity:.45;stroke-width:1.4}
.grid{stroke:#ffffff;stroke-opacity:.05;stroke-width:1}
.dot{fill:#9FD4CB}
.core{fill:#0E2A47;stroke:#5BA69A;stroke-width:4}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes rotr{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.o1{transform-origin:400px 300px;animation:rot 22s linear infinite}
.o2{transform-origin:400px 300px;animation:rotr 34s linear infinite}
.o3{transform-origin:400px 300px;animation:rot 50s linear infinite}
.b{transform-origin:400px 300px;animation:breathe 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.o1,.o2,.o3,.b{animation:none}}
</style>
</defs>
<rect width="800" height="600" rx="24" fill="url(#panel)"/>
<g><line class="grid" x1="0" y1="0" x2="0" y2="600"/>
<line class="grid" x1="50" y1="0" x2="50" y2="600"/>
<line class="grid" x1="100" y1="0" x2="100" y2="600"/>
<line class="grid" x1="150" y1="0" x2="150" y2="600"/>
<line class="grid" x1="200" y1="0" x2="200" y2="600"/>
<line class="grid" x1="250" y1="0" x2="250" y2="600"/>
<line class="grid" x1="300" y1="0" x2="300" y2="600"/>
<line class="grid" x1="350" y1="0" x2="350" y2="600"/>
<line class="grid" x1="400" y1="0" x2="400" y2="600"/>
<line class="grid" x1="450" y1="0" x2="450" y2="600"/>
<line class="grid" x1="500" y1="0" x2="500" y2="600"/>
<line class="grid" x1="550" y1="0" x2="550" y2="600"/>
<line class="grid" x1="600" y1="0" x2="600" y2="600"/>
<line class="grid" x1="650" y1="0" x2="650" y2="600"/>
<line class="grid" x1="700" y1="0" x2="700" y2="600"/>
<line class="grid" x1="750" y1="0" x2="750" y2="600"/>
<line class="grid" x1="800" y1="0" x2="800" y2="600"/>
<line class="grid" x1="0" y1="0" x2="800" y2="0"/>
<line class="grid" x1="0" y1="50" x2="800" y2="50"/>
<line class="grid" x1="0" y1="100" x2="800" y2="100"/>
<line class="grid" x1="0" y1="150" x2="800" y2="150"/>
<line class="grid" x1="0" y1="200" x2="800" y2="200"/>
<line class="grid" x1="0" y1="250" x2="800" y2="250"/>
<line class="grid" x1="0" y1="300" x2="800" y2="300"/>
<line class="grid" x1="0" y1="350" x2="800" y2="350"/>
<line class="grid" x1="0" y1="400" x2="800" y2="400"/>
<line class="grid" x1="0" y1="450" x2="800" y2="450"/>
<line class="grid" x1="0" y1="500" x2="800" y2="500"/>
<line class="grid" x1="0" y1="550" x2="800" y2="550"/>
<line class="grid" x1="0" y1="600" x2="800" y2="600"/></g>
<circle cx="400" cy="300" r="280" fill="url(#g)" class="b"/>
<g transform="rotate(0 400 300)"><g class="o1"><ellipse class="orb" cx="400" cy="300" rx="300" ry="110"/><circle class="dot" cx="700.0" cy="300.0" r="7"/><circle cx="700.0" cy="300.0" r="14" fill="#5BA69A" fill-opacity=".18"/><circle class="dot" cx="100.0" cy="300.0" r="7"/><circle cx="100.0" cy="300.0" r="14" fill="#5BA69A" fill-opacity=".18"/></g></g>
<g transform="rotate(60 400 300)"><g class="o2"><ellipse class="orb" cx="400" cy="300" rx="300" ry="110"/><circle class="dot" cx="400.0" cy="410.0" r="7"/><circle cx="400.0" cy="410.0" r="14" fill="#5BA69A" fill-opacity=".18"/><circle class="dot" cx="400.0" cy="190.0" r="7"/><circle cx="400.0" cy="190.0" r="14" fill="#5BA69A" fill-opacity=".18"/></g></g>
<g transform="rotate(120 400 300)"><g class="o3"><ellipse class="orb" cx="400" cy="300" rx="300" ry="110"/><circle class="dot" cx="659.8" cy="355.0" r="7"/><circle cx="659.8" cy="355.0" r="14" fill="#5BA69A" fill-opacity=".18"/><circle class="dot" cx="140.2" cy="245.0" r="7"/><circle cx="140.2" cy="245.0" r="14" fill="#5BA69A" fill-opacity=".18"/></g></g>
<circle class="core" cx="400" cy="300" r="26"/><circle cx="400" cy="300" r="10" fill="#5BA69A"/>
</svg>